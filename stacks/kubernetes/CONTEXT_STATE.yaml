current_step: 8
total_steps: 16
stack: kubernetes
status: in_progress
context_capsule: 'Implémentation et validation réussies du scheduling avancé (DaemonSet,
  Static Pod, PriorityClass, Affinity/Tolerations) sur K3s mono-nœud. Manifests multi-nœuds
  prêts. Sécurité proactive (securityContext durci pour hostPath/root). Gestion précise
  des taints/affinités et objets temporaires. `preemptionPolicy: Never` pour éviter
  l''éviction.'
key_decisions:
- 4 namespaces par environnement (dev, staging, prod, tools) avec labels standardisés
  (environment, team, managed-by)
- Rejet clusters séparés (coût/complexité) et namespace unique (aucune isolation)
- Validation automatisée via kubectl pour reproductibilité
- ClusterRole + RoleBindings pour Dev et CI/CD (DRY sur dev/staging)
- Roles namespace distincts pour QA (lecture seule staging) et SRE applicatif (prod)
- ClusterRoleBinding séparé pour SRE cluster (nodes, persistentvolumes)
- Groupes SSO comme subjects pour révocation centralisée
- ServiceAccounts CI/CD dédiés par environnement, aucun accès prod
- Deployment avec 3 replicas et RollingUpdate pour disponibilité pendant mises à jour
- Service ClusterIP (8080→80) pour exposition limitée au cluster
- ConfigMap pour découpler config Nginx de l'image et du filesystem
- Image épinglée par digest avec imagePullPolicy IfNotPresent
- 'Contrôles de sécurité: runAsNonRoot, drop capabilities, allowPrivilegeEscalation:
  false'
- Ajout de readinessProbe sur `/hello` et livenessProbe sur `/health` pour le conteneur
  Nginx.
- Configuration des endpoints de sonde pour dépendre de la présence de `index.html`
  afin de simuler des pannes.
- 'Définition de valeurs temporelles conservatrices pour les sondes (e.g., `initialDelaySeconds:
  5`, `periodSeconds: 10`, `failureThreshold: 3`).'
- Déploiement de Prometheus et Grafana dans le namespace `tools` pour la collecte
  et la visualisation des métriques.
- Implémentation de ResourceQuotas et LimitRanges différenciés par namespace (dev,
  staging, prod, tools).
- Intégration des configurations via Kustomize dans `stacks/kubernetes/infra/base/`.
- Définition de valeurs initiales conservatrices pour les quotas et limites.
- Blue/Green adopté pour staging (rollback instantané via Service selector).
- Canary adopté pour dev (observation progressive via nombre de réplicas).
- Versions distinguées par endpoint /version et labels track.
- ResourceQuota et LimitRange ajustés pour la coexistence des versions.
- Utilisation d'un DaemonSet pour la collecte de logs, montant `/var/log/pods/` via
  `hostPath`, avec un `securityContext` durci pour limiter les risques.
- Déploiement temporaire d'un Static Pod Nginx pour illustrer la gestion directe par
  le kubelet, hors API Server.
- 'Création d''une PriorityClass `nginx` (valeur 1000, `preemptionPolicy: Never`)
  pour l''application Fablab, afin de garantir sa stabilité sans éviction agressive.'
- Mise en œuvre d'une `nodeAffinity` `requiredDuringSchedulingIgnoredDuringExecution`
  et d'une `toleration` correspondante pour simuler le placement de pods sur un nœud
  « premium » labellisé et teinté.
pending_risks:
- Prolifération de namespaces non gouvernés à l'avenir
- Namespace mal configuré peut exposer des ressources sensibles
- Dérive potentielle des permissions CI/CD vers prod (automatisation tentante)
- 'Risque partagé : modification ClusterRole impacte dev et staging simultanément'
- Dimensionnement des ressources basé sur estimations, à affiner avec observabilité
  (étape 4)
- Registre privé et signature Cosign reportés en production
- PodDisruptionBudget non implémenté, nécessaire en production
- Le dashboard Grafana n'est pas encore provisionné automatiquement.
- Des déploiements applicatifs futurs pourraient échouer ou rencontrer des problèmes
  de performance inattendus si les `requests` et `limits` définis par les équipes
  applicatives ne sont pas en adéquation avec les `ResourceQuotas` et `LimitRanges`
  mis en place.
- Dérive de configuration entre les Deployment Blue et Green.
- Absence d'automatisation pour l'analyse des métriques Canary et le rollback.
- Absence de PodDisruptionBudget.
- L'utilisation de `hostPath` et l'exécution en `root` pour le DaemonSet de logs,
  même avec un `securityContext` durci, représente un privilège élevé. Tout élargissement
  de périmètre nécessitera une revue de sécurité approfondie.
- Le maintien éventuel du Static Pod Nginx, déployé pour démonstration, relèvera d'une
  décision ultérieure.
