apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # namespaces
  - base/namespaces.yaml
  # rbac
  - base/rbac/rbac.yaml
  # limit_ranges and resource_quotas
  - base/limit_ranges/limitrange_dev.yaml
  - base/resource_quotas/resourcequota_dev.yaml
  - base/limit_ranges/limitrange_prod.yaml
  - base/resource_quotas/resourcequota_prod.yaml
  - base/limit_ranges/limitrange_staging.yaml
  - base/resource_quotas/resourcequota_staging.yaml
  - base/limit_ranges/limitrange_tools.yaml
  - base/resource_quotas/resourcequota_tools.yaml
  # nginx dev
  - apps/demo/nginx/service-nginx.yaml
  - apps/demo/nginx/configmap-nginx.yaml
  - apps/demo/nginx/deployment-nginx.yaml
  - apps/demo/nginx/deployment-nginx-canary.yaml
  - apps/demo/nginx/priorityclass-nginx.yaml
  # nginx staging
  - apps/staging/nginx/service-nginx.yaml
  - apps/staging/nginx/configmap-nginx.yaml
  - apps/staging/nginx/deployment-nginx-blue.yaml
  - apps/staging/nginx/deployment-nginx-green.yaml
  # grafana
  - apps/demo/grafana/configmap-grafana.yaml
  - apps/demo/grafana/service-grafana.yaml
  - apps/demo/grafana/deployment-grafana.yaml
  # prometheus
  - apps/demo/prometheus/service-prometheus.yaml
  - apps/demo/prometheus/config-configmap-prometheus.yaml
  - apps/demo/prometheus/rules-configmap-prometheus.yaml
  - apps/demo/prometheus/serviceaccount-prometheus.yaml
  - apps/demo/prometheus/deployment-prometheus.yaml
  # logs
  - apps/demo/logs/daemonset-logs.yaml
  - apps/demo/logs/configmap-logs.yaml
