apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: dev
  labels:
    app: nginx
    environment: dev
    team: platform
    managed-by: terraform
data:
  default.conf: |
        server {
            listen 80;

            location = /health {
                access_log off;
                return 200 "Ready\n";
                add_header Content-Type text/plain;
            }

            location = /hello {
                access_log off;
                return 200 "Hello World\n";
                add_header Content-Type text/plain;
            }

            location / {
                return 404;
            }
        }
