# https://kubernetes.io/docs/concepts/services-networking/service/
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: dev
  # NOTE: labels intentionally omitted to keep this exercise focused.
  # environment/team/version labels will be added in later steps.
spec:
  selector:
    app: nginx
  type: ClusterIP
  ports:
  - name: nginx-http
    protocol: TCP
    port: 8080
    targetPort: 80
---

