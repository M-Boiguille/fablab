apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: tools
  labels:
    app: grafana

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest

          ports:
            - name: http
              containerPort: 3000

          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true

      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
