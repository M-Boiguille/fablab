apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: dev
  labels:
    app: nginx
    environment: dev
    team: platform
    managed-by: terraform
data:
  default.conf: |
        server {
            listen 80;

            location = /health {
                root /usr/share/nginx/html;
                try_files /index.html =404;
            }

            location = /hello {
                root /usr/share/nginx/html;
                try_files /index.html =404;
            }

            location / {
                return 404;
            }

            location = /stub_status {
                stub_status;
            }
        }
