apiVersion: v1
kind: ConfigMap
metadata:
  namespace: dev
  name: nginx-config
  labels:
    app: nginx
    environment: dev
    team: platform
    managed-by: terraform
immutable: true
data:
  default.conf: |
    server {
        listen 80;

        location = /health {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location = /hello {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location /version {
            return 200 "$nginx_version";
            add_header Content-Type text/plain;
        }

        location / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location = /stub_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }

    server {
        listen 443 ssl;

        ssl_certificate         /usr/share/nginx/certificates/tls.crt;
        ssl_certificate_key     /usr/share/nginx/certificates/tls.key;

        location = /health {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location = /stub_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }
