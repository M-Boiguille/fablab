# Example placeholder. Replace placeholders with real base64 values or generate
# the real Secret outside the repository and do NOT commit it.
#
# Commands to create the real Secret in the dev namespace:
#   kubectl create secret tls nginx-secret \
#       --namespace dev \
#       --cert=/path/to/tls.crt \
#       --key=/path/to/tls.key \
#       --dry-run=client \
#       -o yaml > stacks/kubernetes/infra/apps/demo/nginx/secret-tls-nginx.yaml
#
# The metadata.name below should match the `secretName` referenced by the
# Deployment. Adapt it if your Deployment uses a different name.
apiVersion: v1
kind: Secret
metadata:
  name: nginx-secret
  namespace: dev
type: kubernetes.io/tls
data:
  tls.crt: <base64-encoded-certificate>   # required
  tls.key: <base64-encoded-private-key>   # never commit real key
