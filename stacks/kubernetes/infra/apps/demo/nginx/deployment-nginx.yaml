# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: dev
  labels:
    app: nginx
    environment: dev
    team: platform
    version: "1.30.4"
    managed-by: terraform
spec:
  selector:
    matchLabels:
      app: nginx
  replicas: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: nginx
        prometheus.io/scrape: "true"
        prometheus.io/port: "8123"
      labels:
        app: nginx
        environment: dev
        team: platform
        version: "1.30.4"
        managed-by: terraform
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
      containers:
      - name: nginx
        image: nginx:1.30.4@sha256:09cc2702709e6388d979d8030e3ab4eb1ceb699b2dced26d7543e872a822e823
        command:
            - /bin/sh
            - -c
            - |
              touch /usr/share/nginx/html/index.html;
              exec nginx -g 'daemon off;'
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 200Mi
        ports:
        - containerPort: 80
          name: nginx
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 1
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /hello
            port: 80
          initialDelaySeconds: 1
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 1
          successThreshold: 1
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 101
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        - name: html
          mountPath: /usr/share/nginx/html
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
      - name: nginx-prometheus-exporter
        image: nginx/nginx-prometheus-exporter:1.5.3
        args:
          - "--nginx.scrape-uri=http://127.0.0.1:80/stub_status"
          - "--web.listen-address=:8123"          
        ports:
          - name: metrics
            containerPort: 8123
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: html
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      restartPolicy: Always
---

