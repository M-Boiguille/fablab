# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: dev
  # NOTE: labels intentionally limited for this learning exercise.
  # environment, team, version and managed-by labels will be added in later steps.
  labels:
    app: nginx
spec:
  selector:
    matchLabels:
      app: nginx
  replicas: 3
  strategy:
    rollingUpdate:
      # NOTE: maxSurge: 2 is intentionally set to observe rolling-update behavior in this exercise.
      # In production with cost constraints, maxSurge: 1 would be more conservative.
      maxSurge: 2
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container:  nginx
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.30.4
        # NOTE: IfNotPresent is used in dev to avoid unnecessary pulls during the exercise.
        # In production, use Always with immutable tags or a private registry with digest pinning.
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 150Mi
        ports:
        - containerPort: 80
          name: nginx
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
      restartPolicy: Always
---

