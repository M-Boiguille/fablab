# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: dev
  labels:
    app: nginx
    environment: dev
    team: platform
    version: "1.30.4"
    managed-by: terraform
spec:
  selector:
    matchLabels:
      app: nginx
  replicas: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container:  nginx
      labels:
        app: nginx
        environment: dev
        team: platform
        version: "1.30.4"
        managed-by: terraform
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
      containers:
      - name: nginx
        image: nginx:1.30.4@sha256:09cc2702709e6388d979d8030e3ab4eb1ceb699b2dced26d7543e872a822e823
# =========== code temporaire - probe test
        command: ["/bin/sh", "-c"]
        args:
          - |
            sleep 2
            touch /tmp/index.html
            sleep 2
            rm -rf /tmp/index.html
            sleep 2
            touch /tmp/index.html
            sleep 10
            exec nginx -g "daemon off;"
# =========== code temporaire - probe test
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 200Mi
        ports:
        - containerPort: 80
          name: nginx
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 1
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /hello
            port: 80
          initialDelaySeconds: 1
          periodSeconds: 1
          timeoutSeconds: 2
          failureThreshold: 5
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 101
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
      restartPolicy: Always
---

