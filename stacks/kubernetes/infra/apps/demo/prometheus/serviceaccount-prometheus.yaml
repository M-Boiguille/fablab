# =====
# ===== SERVICE ACCOUNT PROMETHEUS
# =====
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
  name: prometheus-dev
  namespace: tools
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-serviceaccount-dev
  namespace: dev
subjects:
- kind: ServiceAccount
  name: prometheus-dev
  namespace: tools 
roleRef:
  kind: ClusterRole
  name: prometheus
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""] 
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
