# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-green
  namespace: staging
  labels:
    app: nginx
    environment: staging
    team: platform
    managed-by: terraform
    version: "1.31.5"
    track: "green"
spec:
  selector:
    matchLabels:
      app: nginx
      environment: staging
      track: "green"
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: nginx
        prometheus.io/scrape: "true"
        prometheus.io/port: "8123"
      labels:
        app: nginx
        environment: staging
        track: "green"
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
      containers:
      - name: nginx
        image: nginx:1.31.5
        command:
            - /bin/sh
            - -c
            - |
              touch /usr/share/nginx/html/index.html;
              exec nginx -g 'daemon off;'
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 6Mi
          limits:
            cpu: 150m
            memory: 16Mi
        ports:
        - containerPort: 80
          name: nginx
        # Liveness: detect deadlock/irrecoverable state. Period 10s, 3 consecutive failures => restart after ~30s.
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
          successThreshold: 1
        # Readiness: ensure pod is able to serve traffic. Period 10s, 3 consecutive failures => remove from Service.
        readinessProbe:
          httpGet:
            path: /hello
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
          successThreshold: 1
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 101
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        - name: html
          mountPath: /usr/share/nginx/html
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
      - name: nginx-prometheus-exporter
        image: nginx/nginx-prometheus-exporter:1.5.3
        args:
          - "--nginx.scrape-uri=http://127.0.0.1:80/stub_status"
          - "--web.listen-address=:8123"          
        resources:
          requests:
            cpu: 12m
            memory: 5Mi
          limits:
            cpu: 50m
            memory: 8Mi
        ports:
          - name: metrics
            containerPort: 8123
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: html
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      restartPolicy: Always
---

