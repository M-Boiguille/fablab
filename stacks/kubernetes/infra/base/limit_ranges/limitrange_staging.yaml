apiVersion: v1
kind: LimitRange
metadata:
  name: staging-limits
  namespace: staging
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 60m
      memory: 7Mi
    default:
      cpu: 120m
      memory: 14Mi
    min:
      cpu: 12m
      memory: 5Mi
    max:
      cpu: 180m
      memory: 19Mi
