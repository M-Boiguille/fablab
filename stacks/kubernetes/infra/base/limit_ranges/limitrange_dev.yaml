apiVersion: v1
kind: LimitRange
metadata:
  name: dev-limits
  namespace: dev
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 50m
      memory: 6Mi
    default:
      cpu: 100m
      memory: 12Mi
    min:
      cpu: 10m
      memory: 4Mi
    max:
      cpu: 150m
      memory: 16Mi
