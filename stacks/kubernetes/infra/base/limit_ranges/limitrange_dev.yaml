apiVersion: v1
kind: LimitRange
metadata:
  name: dev-limits
  namespace: dev
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 15m
      memory: 5Mi
    default:
      cpu: 50m
      memory: 10Mi
    min:
      cpu: 10m
      memory: 4Mi
    max:
      cpu: 150m
      memory: 16Mi
