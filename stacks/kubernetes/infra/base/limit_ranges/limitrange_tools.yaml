apiVersion: v1
kind: LimitRange
metadata:
  name: tools-limits
  namespace: tools
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    default:
      cpu: 100m
      memory: 128Mi
    min:
      cpu: 10m
      memory: 4Mi
    max:
      cpu: 600m
      memory: 768Mi
