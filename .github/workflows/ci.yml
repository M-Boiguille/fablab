name: CI - Validation des PRs

on:
  pull_request:
    branches: [main]
    paths:
      - 'stacks/**'
  workflow_dispatch:
    inputs:
      pr_head_ref:
        description: 'Branche step/<stack>/XX-nom a valider'
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml requests

      - name: Check PR artifacts and attestation
        env:
          PR_HEAD_REF: ${{ github.event.inputs.pr_head_ref || github.head_ref }}
        run: |
          python scripts/pipeline_orchestrator.py --action check-pr --pr-head-ref "$PR_HEAD_REF"
